<main class="notes-main">
<div class="notes-heading"><h1>研究</h1></div>
<div class="research-intro"><p class="research-status">研究计划</p><p>让 AI 随着人的变化，调整帮助方式。</p></div>
<div class="research-directions">
<section class="research-direction" aria-labelledby="agents-title"><span class="research-number" aria-hidden="true">01</span><div><h2 id="agents-title">长期交互的 Agent</h2><p>构建能长期相处的 Agent：更新记忆、理解人的变化，选择何时、如何帮忙。</p></div></section>
<section class="research-direction" aria-labelledby="models-title"><span class="research-number" aria-hidden="true">02</span><div><h2 id="models-title">基础模型与训练方法</h2><p>设计训练目标与反馈，让模型学会调整帮助方式，并检验它能否适应新用户、新场景。</p></div></section>
<section class="research-direction" aria-labelledby="evaluation-title"><span class="research-number" aria-hidden="true">03</span><div><h2 id="evaluation-title">评测与对照实验</h2><p>比较不同模型与帮助方式：任务完成得怎样，离开 AI 后，人还保留了哪些能力。</p></div></section>
</div>
</main>
